<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Moises Rander</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/assets/img/favicon-32.png" sizes="32x32">
  <meta name="theme-color" content="#0e0e11">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .nf {
      min-height: 80vh;
      display: grid;
      place-content: center;
      text-align: center;
      gap: var(--space-5);
    }

    .nf .code {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--primary-text);
    }

    .nf h1 {
      font-size: clamp(28px, 4vw, 40px);
    }

    .nf p {
      color: var(--muted-foreground);
      margin: 0;
    }
  </style>
</head>

<body>
  <main class="container nf">
    <div class="code">404</div>
    <h1>Esta página não existe</h1>
    <p>O endereço pode ter mudado, ou o link estar incompleto.</p>
    <p><a class="btn btn-primary" href="/">Voltar para o início</a></p>
  </main>
</body>

</html>
